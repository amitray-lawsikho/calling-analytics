name: LSQ Pipeline

on:
  workflow_dispatch:

jobs:
  run-lsq:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Authenticate GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.BQ_CREDENTIALS }}'

    - name: Run LSQ Pipeline
      run: python lsq_pipeline.py
      env:
        LSQ_ACCESS_KEY: ${{ secrets.LSQ_ACCESS_KEY }}
        LSQ_SECRET_KEY: ${{ secrets.LSQ_SECRET_KEY }}
