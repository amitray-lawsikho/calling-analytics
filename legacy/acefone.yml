name: Acefone Pipeline

on:
  workflow_dispatch:

jobs:
  run-acefone:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Authenticate GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.BQ_CREDENTIALS }}'

    - name: Run Acefone Pipeline
      run: python acefone_pipeline.py
      env:
        ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
        ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}

    - name: Debug Acefone
      run: python debug_acefone.py
      env:
        ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
        ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}
