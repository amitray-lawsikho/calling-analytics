name: Revenue BigQuery Pipeline

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:

    runs-on: ubuntu-latest

    concurrency:
      group: revenue-pipeline
      cancel-in-progress: false

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Revenue Pipeline
      env:
        BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
      run: |
        python revenue_pipeline.py || (sleep 30 && python revenue_pipeline.py)
