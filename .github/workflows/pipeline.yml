name: Revenue BigQuery Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:

    runs-on: ubuntu-latest

    concurrency:
      group: revenue-pipeline
      cancel-in-progress: false

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Check correct minute
      id: check_time
      run: |
        minute=$(date +'%M')
        if [[ "$minute" == "00" || "$minute" == "15" || "$minute" == "30" || "$minute" == "45" ]]; then
          echo "run_pipeline=true" >> $GITHUB_OUTPUT
        else
          echo "run_pipeline=false" >> $GITHUB_OUTPUT
        fi

    - name: Run Revenue Pipeline
      if: steps.check_time.outputs.run_pipeline == 'true'
      env:
        BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
      run: |
        python revenue_pipeline.py || (sleep 30 && python revenue_pipeline.py)
