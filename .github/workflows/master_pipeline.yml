name: Master Data Pipeline

on:
  schedule:
    - cron: '30 5,8,12,14 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipelines:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Authenticate GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.BQ_CREDENTIALS }}'

    - name: Run Acefone Pipeline
      run: python acefone_pipeline.py
      env:
        ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
        ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}

    - name: Run LSQ Pipeline
      run: python lsq_pipeline.py
      env:
        BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        LSQ_ACCESS_KEY: ${{ secrets.LSQ_ACCESS_KEY }}
        LSQ_SECRET_KEY: ${{ secrets.LSQ_SECRET_KEY }}

    - name: Run Revenue Pipeline
      run: python revenue_pipeline.py
      env:
        BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
