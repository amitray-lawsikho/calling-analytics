name: Master Data Pipeline

on:
  schedule:
    - cron: '30 5,8,12,14 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipelines:
    runs-on: ubuntu-latest

    steps:
    # ---------------- CHECKOUT ----------------
    - name: Checkout repo
      uses: actions/checkout@v4

    # ---------------- PYTHON SETUP ----------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ---------------- CACHE ----------------
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    # ---------------- INSTALL ----------------
    - name: Install dependencies
      run: pip install -r requirements.txt

    # ---------------- GCP AUTH ----------------
    - name: Authenticate GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.BQ_CREDENTIALS }}'

    # ---------------- REVENUE PIPELINE ----------------
    - name: Running Revenue Pipeline
      run: python revenue_pipeline.py

    # ---------------- MANUAL CALLS PIPELINE ----------------
    - name: Running Manual Calls Pipeline
      run: python manual_calls_pipeline.py
      env:
        BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}

    # ---------------- OZONETEL PIPELINE ----------------
    - name: Running Ozonetel Pipeline
      run: python ozonetel_pipeline.py
      env:
        OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
        OZONETEL_USERNAME: ${{ secrets.OZONETEL_USERNAME }}
        TEAM_SHEET_URL: ${{ secrets.TEAM_SHEET_URL }}

    # ---------------- ACEFONE PIPELINE ---------------
    - name: Running Acefone Pipeline
      run: python acefone_pipeline.py
      env:
        ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
        ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}
        
    # ---------------- LSQ STAGE CHANGE PIPELINE ----------------
    - name: Run stage_changed_truncate.py
      run: python stage_changed_truncate.py

    # ---------------- LSQ PIPELINE ----------------
    - name: Running LSQ Pipeline
      run: python lsq_pipeline.py
      env:
        LSQ_ACCESS_KEY: ${{ secrets.LSQ_ACCESS_KEY }}
        LSQ_SECRET_KEY: ${{ secrets.LSQ_SECRET_KEY }}
