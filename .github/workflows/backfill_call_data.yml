name: Backfill Acefone + Ozonetel (Last 10 Days)

on:
  workflow_dispatch:   # ✅ Manual trigger only (Run once from UI)

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas pytz google-cloud-bigquery pyarrow

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BQ_CREDENTIALS }}

      - name: Run Backfill Script
        env:
          ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
          ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USERNAME: ${{ secrets.OZONETEL_USERNAME }}
          TEAM_SHEET_URL: ${{ secrets.TEAM_SHEET_URL }}
        run: |
          python Update_manually_CDR.py
