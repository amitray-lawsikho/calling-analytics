name: Field check (one-off, read-only)

# Manual run only (the first run's log exposed a signed recording link from a response header; that is now cut). Reads MCube and Acefone only; prints field names and masked
# shapes to the run summary. No Supabase access, no writes. Delete this file after the check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytz
      - run: python tools/field_check.py
        env:
          MCUBE_TOKEN: ${{ secrets.MCUBE_TOKEN }}
          ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
          ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}
