name: Acefone Pipeline

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:

    runs-on: ubuntu-latest

    concurrency:
      group: acefone-pipeline
      cancel-in-progress: false

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Authenticate GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.BQ_CREDENTIALS }}'

    - name: Run Acefone Pipeline
      run: |
        python acefone_pipeline.py || (sleep 30 && python acefone_pipeline.py)
      env:
        ACEFONE_API_KEY: ${{ secrets.ACEFONE_API_KEY }}
        ACEFONE_ACCOUNT_ID: ${{ secrets.ACEFONE_ACCOUNT_ID }}
